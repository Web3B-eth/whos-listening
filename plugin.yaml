name: whos-listening
version: 0.1.0
description: "Memory that knows who's listening: Private memories only go to models you trust, Shared ones go anywhere."
author: Web3B-eth
license: MIT
homepage: https://github.com/Web3B-eth/whos-listening
kind: standalone
requires_hermes: ">=0.23.0"
provides_hooks:
  - pre_llm_call
  - post_tool_call
provides_middleware:
  - llm_request
optional_env:
  - name: WHOS_LISTENING_SYNC_TOKEN
    description: "Only for sync between gateways: a GitHub fine-grained token with read and write access to the contents of one private repository (see the README, Sync between gateways)."
    password: true

name: whos-listening
version: 0.1.0
description: "Who's Listening: memory that knows who's listening. Private memories only go to models you trust, Shared ones go anywhere."
author: Web3B-eth
license: MIT
homepage: https://github.com/Web3B-eth/whos-listening
kind: standalone
requires_hermes: ">=0.23.0"
provides_hooks:
  - pre_llm_call
  - post_tool_call
provides_middleware:
  - llm_request
optional_env:
  - name: WHOS_LISTENING_SYNC_TOKEN
    description: "Only for sync between gateways: a GitHub fine-grained token with read and write access to the contents of one private repository (see the README, Sync between gateways)."
    password: true
# The settings form in Hermes Desktop (Settings → Plugins), for whichever gateway Desktop is
# connected to. A value set here wins over settings.json; "default" or an empty field means
# "use settings.json, else the built-in default". See the README, Settings.
config_schema:
  gateway:
    type: str
    choices: [default, private, shared]
    label: "This gateway"
    description: "Whether the machine running this Hermes may keep Private memories. private: yes (your own computer). shared: no (a server you don't fully trust). default: private on your own machine, shared on a hosted Hermes such as Hermes Cloud."
  review:
    type: str
    choices: [default, ask, auto]
    label: "Held saves"
    description: "What happens to a save that is held because the chat read outside content. auto (the default): Auto-review checks it on the chat's own model and saves it if it's clearly something you said about yourself. ask: it waits until you approve it with /memories approve N."
  duplicates:
    type: str
    choices: [default, skip, keep]
    label: "Near-duplicates"
    description: "What happens when the assistant saves something that rewords a memory you already have, such as \"Bought a Santa Cruz Hightower\" after \"Owns a Santa Cruz Hightower\". skip (the default): nothing new is saved. keep: it is saved anyway. Checked on this gateway, by comparing words; nothing is sent anywhere."
  duplicate_judge:
    type: str
    choices: [default, off, clef, jev, model]
    label: "Duplicate judge"
    description: "A second check for near-duplicates, by a model. It catches rewordings the word check misses, such as \"Allergic to peanuts\" after \"Has a peanut allergy\". clef: Clef, a decision model that runs privately on Venice (uses the Venice key Hermes already has), so it can check Private memories too. jev: Jev, a decision model that is anonymized on Venice (TypeSafe sees the text), so it only checks Shared memories unless you trust anonymized Venice models. model: your default model in Hermes; it checks Private memories only if that model and every fallback are Private, and takes seconds instead of under one. off (the default): words only. Each check sends the new memory and up to 20 others."
  venice_anonymized:
    type: str
    choices: [default, shared, private]
    label: "Venice anonymized models"
    description: "Venice runs some models itself (private) and passes others, such as Claude and Gemini, to the company that made them with your identity stripped (anonymized: that company sees the content). shared (the default): anonymized models get Shared memories only. private: treat them like Venice's private models. Venice's private models are Private either way."
  sync_repo:
    type: str
    label: "Sync repository"
    description: "The private GitHub repository to sync Shared memories through. Example: you/whos-listening-sync (a link such as https://github.com/you/whos-listening-sync works too). Empty: sync is off, unless settings.json sets it. Once set here, settings.json's sync settings are ignored."
  sync_name:
    type: str
    label: "Gateway name for sync"
    description: "A short name for this gateway in the sync file, different on each gateway. Example: laptop, or cloud. Empty: one is made up."
  sync_interval:
    type: int
    label: "Sync interval (seconds)"
    description: "Seconds between automatic syncs, at least 30. Example: 300 for every five minutes. 0: settings.json's, else 60."
  sync_token:
    type: secret
    env: WHOS_LISTENING_SYNC_TOKEN
    label: "Sync token"
    description: "A GitHub fine-grained personal access token (it starts with github_pat_) with access to the sync repository only and the Contents: Read and write permission. Create one at github.com/settings/personal-access-tokens/new."
  private_platforms:
    type: list
    label: "Extra Private platforms"
    description: "Hermes platforms that may see Private memories besides cli, tui, desktop and local, as a JSON list. Example: [\"signal\"]. Added to settings.json's; [] for none."
  shared_platforms:
    type: list
    label: "Shared platforms"
    description: "Hermes platforms that never see Private memories, even ones that would by default, as a JSON list. Example: [\"desktop\"]. Added to settings.json's; [] for none."
  private_hosts:
    type: list
    label: "Extra Private model hosts"
    description: "Model API hosts you trust with Private memories, as a JSON list of host names (a domain covers its subdomains). Example: [\"models.example.org\"]. Added to settings.json's; [] for none."
  shared_hosts:
    type: list
    label: "Shared model hosts"
    description: "Model API hosts that never get Private memories, even default Private ones, as a JSON list of host names. Example: [\"api.venice.ai\"]. Added to settings.json's; [] for none."
  routes:
    type: dict
    label: "Routes"
    description: "Private or shared by provider/model, */model or provider, as a JSON object. Example: {\"nous/gpt-6-luna\": \"private\", \"openrouter\": \"shared\"}. Combined with settings.json's (shared wins where they disagree); {} for none."

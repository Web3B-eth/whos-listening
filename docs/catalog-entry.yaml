subdir: ""
version: "0.1.0"
description: >-
  Memory that knows who's listening. Each memory is Private or Shared. A request carries
  Private memories only if all three layers that see it are Private: the gateway (the machine
  running Hermes, which stores the memories), the platform (the terminal, TUI, Desktop and
  hermes chat by default; chat apps such as Telegram, the API server, web chat, cron and
  subagents are Shared) and the model route (Venice and models on your own machine or network
  by default). Each layer is the user's call in settings.json (gateway, private_platforms,
  shared_platforms, routes, private_hosts, shared_hosts). An llm_request guard removes tagged
  Private memories from every request that isn't Private, and fails closed. A Shared gateway
  keeps no Private memories. Saves after the chat read outside content wait for your OK
  (/memories pending, approve, undo), with an optional Auto-review on the chat's own model;
  forgotten facts can't be saved again from chat; whos-listening_recall runs at most 5 times a turn.
  Disclosure — stores memories in SQLite in the active Hermes home only
  ($HERMES_HOME/whos-listening/), including forgotten text until purged. No network calls of
  its own except the optional Auto-review (off by default): one request per held save, at most
  3 a turn, through Hermes' PluginLlm on the chat's current model, in a short-lived background
  thread; it sends the memory and the user's three newest messages, and runs only when Hermes'
  fallback providers are as trusted as the chat's route. Rewrites outgoing main chat requests
  that aren't Private (removing Private memories). Reads model, providers' base_url and
  fallback_providers from config.yaml (never keys). Registers a /memories slash command.
  plugin.yaml says kind: standalone, so Hermes loads it twice (general discovery at startup,
  which registers /memories, and the memory loader for the provider; Hermes' dual-kind path).
  The two copies share their in-memory route and outside-content books through one entry the
  plugin adds to sys.modules under its own key ("_whos_listening_state", via setdefault); it
  replaces or rebinds nothing in Hermes core, and validate's no-core-override check passes.
  No credentials, telemetry, self-updater or long-running background process.
maintainer: Web3B-eth
tier: community
category: memory
docs_url: https://github.com/Web3B-eth/whos-listening/blob/976b90f836dd6d4e455ee04def2bd686b2b76a51/README.md
readme: true
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - post_tool_call
  provides_middleware:
    - llm_request
  requires_env: []
known_issues:
  - Hermes runs plugin middleware only on main chat requests. Compression, the tool-limit summary, mixture-of-agents and side calls skip the guard; see README Limits.
  - Auto-review needs the default in-process plugin mode.
  - The first turn after a gateway starts carries Shared memories only.
  - Subagents and scheduled jobs count as Shared, so they never see Private memories.
  - For /memories to work from the first message, also run `hermes plugins enable whos-listening` (for a memory provider, install --enable only sets memory.provider).
requires_hermes: ">=0.23.0"

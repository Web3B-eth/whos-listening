name: whos-listening
title: Who's Listening
repo: https://github.com/Web3B-eth/whos-listening
sha: b9a52cb01708cfbd0c7aabcf4a16ce807f35ef7d
subdir: ""
version: "0.1.0"
description: >-
  Memory that knows who's listening. Each memory is Private or Shared. A request carries
  Private memories only if all three layers that see it are Private: the gateway (the machine
  running Hermes, which stores the memories; a hosted Hermes such as Hermes Cloud is Shared by
  default and keeps Shared memories only), the platform (the terminal, TUI, Desktop and hermes
  chat by default; chat apps, the API server, web chat, cron and subagents are Shared) and the
  model route (Venice's private models and models on your own machine or network by default;
  Venice's anonymized models are Shared, from Venice's public model list). Each layer is the
  user's call in Desktop's plugin settings or settings.json. An llm_request guard removes tagged
  Private memories from every main chat request that isn't Private, and fails closed. Saves
  after the chat read outside content are held; Auto-review (on by default) checks each on the
  chat's own model, and anything else waits for the user. On a Private-capable gateway an
  assistant's Shared save becomes Shared only if a check on the chat's own model finds the user
  said any model may see it; otherwise it is saved Private. Review choices (keep, approve, reject)
  go through on the user's OK; after outside content, or to share a Private memory, they need the
  memory's number or Auto-review. Private and Shared memories are numbered P1, S1. Near-duplicate saves are skipped by
  a local word check, then a duplicate judge. A Private and a Shared memory saying the same
  thing are flagged for the user. Four tools (remember, recall, forget, review) and a /memories
  command: review, keep, approve, undo, forget, export, and optional sync of Shared memories
  between gateways through the user's private GitHub repository.
  Disclosure — Stores memories in SQLite in the active Hermes home only
  ($HERMES_HOME/whos-listening/), including forgotten text until purged; /memories export writes
  a plain-text file there (mode 600). Network calls: (1) Venice's public model list
  (api.venice.ai/api/v1/models, no key, nothing about the user), at most daily. (2) The duplicate
  judge, on by default (Clef) whenever Hermes has a Venice key: POST api.venice.ai/api/v1/decisions
  with that key, sending the new memory and up to 20 others, Private ones included, for each save
  the word check lets through, each sync arrival and each memory in a review scan;
  duplicate_judge off keeps it local. (3) Side calls through Hermes' PluginLlm on the chat's
  model: Auto-review, for a held save (the memory and the user's three newest messages) and, after
  outside content or to share a Private memory, for a review choice made without the memory's
  number (the exact change, the assistant's last reply and the user's three newest messages; 20 s
  limit); the sharing check, for each assistant Shared save on a Private-capable gateway (the
  memory and the user's three newest messages); never the outside content or other stored
  memories, at most 3 checks a turn in all, and only when Hermes' fallbacks are as trusted as the
  route (Shared memories only on a Shared route); and the optional "model" judge. (4)
  Sync, only if set up: the GitHub API, sending Shared memory text (forgotten ones as a hash),
  the gateway's name and times. Reads model, providers' base_url and fallback_providers from
  config through load_config_readonly (never keys). Reads two secrets through get_secret only:
  its declared WHOS_LISTENING_SYNC_TOKEN, and the Venice key Hermes holds for its Venice
  provider (VENICE_API_KEY, or the custom-endpoint key for api.venice.ai), sent only to Venice.
  Short-lived background threads started by chat activity (sync, the Venice list refresh,
  Auto-review of held saves, a review scan), each with its own SQLite connection to the same
  file; no long-running process. INFO lines in agent.log for each duplicate check, each
  Auto-review run and each sync: memory numbers, odds and fixed words only, never memory text
  or a model's reason. plugin.yaml says kind: standalone,
  so Hermes loads it twice (general discovery at startup, which registers /memories, and the
  memory loader for the provider); the two copies share their in-memory state through one entry
  the plugin adds to sys.modules under its own key ("_whos_listening_state", via setdefault). It
  replaces or rebinds nothing in Hermes core. No telemetry, self-updater, shell commands or
  Python dependencies.
maintainer: Web3B-eth
tier: community
category: memory
docs_url: https://github.com/Web3B-eth/whos-listening/blob/b9a52cb01708cfbd0c7aabcf4a16ce807f35ef7d/README.md

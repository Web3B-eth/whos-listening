name: whos-listening
title: Who's Listening
repo: https://github.com/Web3B-eth/whos-listening
sha: 4eb5ea8f64362109c140dc3f2ce4c8eba0bf116c
subdir: ""
version: "0.1.0"
description: >-
  Memory that knows who's listening. Each memory is Private or Shared. Private memories go into a
  request only when the machine running Hermes, the app you chat in and the model provider are all
  trusted. By default that means the machine you install it on (a hosted Hermes such as Hermes
  Cloud counts as Shared), the terminal and Hermes Desktop, and Venice's private models or models
  on your own machine or network. Everything else gets Shared memories only. In the plugin's
  settings you can mark any gateway, chat platform or model route as Private or Shared. Disclosure
  — memories stay in $HERMES_HOME/whos-listening/. With a Venice key in Hermes, a duplicate check
  sends each new memory and up to 20 others, Private ones included, to Venice's private Clef model
  (duplicate_judge off keeps it local). Shared memories sync to your GitHub repository only if you
  set that up.
maintainer: Web3B-eth
tier: community
category: memory
docs_url: https://github.com/Web3B-eth/whos-listening/blob/4eb5ea8f64362109c140dc3f2ce4c8eba0bf116c/README.md
readme: true
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - post_tool_call
  provides_middleware:
    - llm_request
  requires_env: []
known_issues:
  - Hermes runs plugin middleware only on main chat requests. Compression, the tool-limit summary, mixture-of-agents and side calls skip the guard; see README Limits.
  - The first turn after a gateway starts carries Shared memories only, and Venice models count as Shared until Venice's model list has loaded on a new gateway.
  - Subagents and scheduled jobs count as Shared, so they never see Private memories.
  - Auto-review needs the default in-process plugin mode; under plugins.isolation host, held saves wait for the user.
  - For /memories to work from the first message, also run `hermes plugins enable whos-listening` (for a memory provider, install --enable only sets memory.provider).
  - If a model calls a memory tool through tool_call, Hermes answers that it's not a known tool name; the plugin tells models to call its tools directly.
requires_hermes: ">=0.23.0"
